<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Global Brands</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Outfit:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#060608;color:#F2EDE4;min-height:100vh;display:flex;align-items:center;justify-content:center}
body::before{content:'';position:fixed;inset:0;z-index:0;background:url('https://images.unsplash.com/photo-1569629743817-70d8db6c323b?w=1400&q=80') center/cover no-repeat;filter:blur(8px) brightness(.2) saturate(1.2);transform:scale(1.06)}
.overlay{position:fixed;inset:0;z-index:1;background:rgba(4,4,10,.7)}
.card{position:relative;z-index:10;text-align:center;padding:20px;max-width:460px;width:100%}
.globe{width:64px;height:64px;border-radius:50%;border:2px solid rgba(201,168,76,.5);display:flex;align-items:center;justify-content:center;background:rgba(201,168,76,.06);margin:0 auto 18px}
.globe svg{width:30px;height:30px;stroke:#C9A84C;fill:none;stroke-width:1.5}
.brand{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:700;margin-bottom:6px}
.eyebrow{font-size:.52rem;letter-spacing:.28em;text-transform:uppercase;color:#C9A84C;margin-bottom:24px}
.lock-icon{font-size:3.5rem;margin-bottom:20px;filter:grayscale(.3)}
h1{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;margin-bottom:10px;line-height:1.25}
.msg{font-size:.82rem;color:rgba(242,237,228,.5);line-height:1.8;max-width:340px;margin:0 auto}
.divider{width:40px;height:1px;background:rgba(201,168,76,.3);margin:24px auto}
.contact-note{font-size:.7rem;color:rgba(242,237,228,.25);letter-spacing:.06em}
  </style>
</head>
<body>
<div class="overlay"></div>
<div class="card">
  <div class="globe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><ellipse cx="12" cy="12" rx="4" ry="10"/><line x1="2" y1="12" x2="22" y2="12"/></svg></div>
  <div class="eyebrow">Global Brands</div>
  <div class="brand">Rate the World's Greatest</div>
  <div class="lock-icon">🔒</div>
  <h1>This site is currently<br>inaccessible</h1>
  <p class="msg">The platform is temporarily unavailable. Please check back later.</p>
  <div class="divider"></div>
  <div class="contact-note">© Global Brands · All rights reserved</div>
</div>
<script>
const SUPA_URL='https://qnggcickewzxjeudjysr.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFuZ2djaWNrZXd6eGpldWRqeXNyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2MjM4MDMsImV4cCI6MjA4NzE5OTgwM30.ULyeE4Gry6cQPczTdXZs9-R4nF80Hfvr6Z-21GIbyLM';

async function checkLock(){
  try{
    const r=await fetch(`${SUPA_URL}/rest/v1/gb_settings?key=eq.site_locked`,{
      headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
    });
    const d=await r.json();
    const locked=d&&d[0]&&d[0].value==='true';
    if(!locked){
      // Site is unlocked — let them through
      sessionStorage.setItem('gb_unlocked','1');
      window.location.href='index.html';
    }
    // else stay on this page
  }catch(e){
    // If Supabase fails, show locked page (safe default)
  }
}

// If already unlocked in this session, check if still unlocked on server
if(sessionStorage.getItem('gb_unlocked')==='1'){
  checkLock();
} else {
  checkLock();
}
</script>
</body>
</html>
